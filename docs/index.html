<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15191d"><title>La Face V&M — Nos vinyles</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="app.js" defer></head>
<body><header><a class="brand" href="./">LA FACE <strong>V<span>&</span>M</strong></a><span class="signature">Deux faces, une collection.</span><button id="unlock">Déverrouiller</button></header>
<main><div class="heading"><div><p class="eyebrow">VIVIEN & MYRIAM</p><h1>Nos vinyles<span>.</span></h1><p id="counts" class="muted">Chargement de la collection…</p></div><button id="add" class="primary" hidden>＋ Ajouter un vinyle</button></div>
<nav aria-label="Collection"><button class="active" data-filter="collection">Collection</button><button data-filter="recherche">Recherches</button><button data-filter="all">Tous les disques</button></nav>
<div class="toolbar"><input id="search" type="search" placeholder="Rechercher un artiste, un album, un morceau…" aria-label="Rechercher"><button id="refresh">Actualiser</button></div>
<p id="notice" role="status"></p><section id="records" aria-label="Vinyles par artiste"></section></main>
<dialog id="pinDialog"><form id="pinForm"><div class="dialogTop"><h2>Accès aux modifications</h2><button type="button" data-close="pinDialog" aria-label="Fermer">✕</button></div><p>Entre votre code PIN pour gérer la collection.</p><label>Code PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" minlength="6" maxlength="12" required autocomplete="off"></label><p id="pinError" role="alert"></p><button class="primary" type="submit">Déverrouiller</button></form></dialog>
<dialog id="editor"><form id="recordForm"><div class="dialogTop"><h2 id="editTitle">Ajouter un vinyle</h2><button type="button" data-close="editor" aria-label="Fermer">✕</button></div><div class="editGrid"><div><canvas id="cover" width="800" height="800" aria-label="Aperçu de la pochette carrée"></canvas><label class="fileLabel">Choisir une pochette<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="crop" hidden><label>Zoom<input id="zoom" type="range" min="1" max="3" value="1" step="0.01"></label><label>Position horizontale<input id="cropX" type="range" min="0" max="1" value="0.5" step="0.01"></label><label>Position verticale<input id="cropY" type="range" min="0" max="1" value="0.5" step="0.01"></label></div><p class="muted small">Pochette carrée 1:1. JPG, PNG ou WebP, 10 Mo maximum.</p></div><div><label>Artiste *<input id="artist" required maxlength="120" list="artists"></label><datalist id="artists"></datalist><label>Nom du vinyle *<input id="album" required maxlength="160"></label><label>Classement<select id="status"><option value="collection">Dans notre collection</option><option value="recherche">Nous le recherchons</option></select></label><label>Notes (facultatif)<textarea id="notes" maxlength="2000" rows="3" placeholder="État, édition, prix souhaité…"></textarea></label></div></div><div class="trackHead"><div><h3>Disques et morceaux</h3><p class="muted small">Facultatif · durée au format 3:42 · faces A, B, C…</p></div><button type="button" id="addDisc">＋ Disque</button></div><div id="discs"></div><p id="saveError" role="alert"></p><div class="actions"><button type="button" data-close="editor">Annuler</button><button id="save" class="primary" type="submit">Enregistrer</button></div></form></dialog>
<dialog id="detail"><div class="dialogTop"><h2>Détail du vinyle</h2><button data-close="detail" aria-label="Fermer">✕</button></div><div id="detailBody"></div></dialog>
<footer>LA FACE V&M <span>Notre collection, à portée de main.</span></footer></body></html>
